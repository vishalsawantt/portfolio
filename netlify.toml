[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache index.html — it must always be fetched fresh so users
# get the latest main.dart.js reference immediately after each deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Never cache the Flutter service worker itself — otherwise it can
# get stuck serving an old cached app version indefinitely.
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# NOTE: this project's `flutter build web` does NOT content-hash
# main.dart.js / flutter_bootstrap.js / flutter_service_worker.js — they
# keep the same filename every build. A "/*.js" immutable-cache rule here
# previously overrode the no-cache rule above for flutter_service_worker.js
# (Netlify merges header rules per file, last match wins), which caused
# browsers to keep a stale service worker — and therefore a stale
# main.dart.js — for up to a year after every deploy. Do not reintroduce
# long-term caching for top-level .js files unless build output starts
# using content-hashed filenames.